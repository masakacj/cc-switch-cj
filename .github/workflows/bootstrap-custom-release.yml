name: Bootstrap Custom Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-custom-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download last successful Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloaded
          gh run download 32694260825 \
            --repo "$GITHUB_REPOSITORY" \
            --name CC-Switch-Windows-x64-custom \
            --dir downloaded
          find downloaded -type f -maxdepth 5 -print

      - name: Prepare stable release asset names
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          MSI=$(find downloaded -type f -name '*.msi' | head -1)
          EXE=$(find downloaded -type f -name '*.exe' | head -1)
          test -n "$MSI"
          test -n "$EXE"
          mkdir -p release-assets
          cp "$MSI" "release-assets/CC-Switch-v${VERSION}-Windows-x64.msi"
          cp "$EXE" "release-assets/CC-Switch-v${VERSION}-Windows-x64.exe"
          (
            cd release-assets
            sha256sum *.msi *.exe > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Publish custom-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG=custom-latest
          SHA=$(git rev-parse HEAD)

          git tag -f "$TAG" "$SHA"
          git push origin "refs/tags/$TAG" --force

          NOTES=$(cat <<EOF
          Custom Windows x64 build based on the fork's latest main.

          Includes the Claude Code VS Code compatibility fix for \`Unsupported content type: redacted_thinking\` when routing OpenAI Responses/Codex reasoning through the Anthropic bridge.

          Files:
          - MSI installer
          - NSIS EXE installer
          - SHA256SUMS.txt

          Source commit: $SHA
          EOF
          )

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "CC Switch Custom v${VERSION}" \
              --notes "$NOTES" \
              --prerelease
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "CC Switch Custom v${VERSION}" \
              --notes "$NOTES" \
              --prerelease
          fi

          gh release upload "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url

      - name: Record successful release publication
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse HEAD)
          PUBLISHED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat > release-status.json <<EOF
          {
            "tag": "custom-latest",
            "version": "$VERSION",
            "source_commit": "$SHA",
            "published_at": "$PUBLISHED_AT",
            "release_url": "https://github.com/$GITHUB_REPOSITORY/releases/tag/custom-latest"
          }
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-status.json
          git commit -m 'chore: record custom release publication'
          git push origin HEAD:main
