name: Build Windows Custom

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-windows-custom.yml'
      - 'scripts/apply_vscode_redacted_thinking_fix.py'
      - 'src-tauri/src/proxy/providers/reasoning_bridge.rs'
      - 'src-tauri/src/proxy/providers/streaming_responses.rs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/tauri.conf.json'

permissions:
  contents: write

concurrency:
  group: windows-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout latest fork main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.12.3 --activate
          node --version
          pnpm --version
          rustc --version

      - name: Apply VSCode redacted_thinking compatibility fix
        shell: pwsh
        run: |
          python scripts/apply_vscode_redacted_thinking_fix.py
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check

      - name: Persist compatibility fix to fork
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if (-not $changes) {
            Write-Host 'Compatibility fix already exists in main.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/proxy/providers/reasoning_bridge.rs src-tauri/src/proxy/providers/streaming_responses.rs
          git commit -m 'fix(proxy): avoid redacted thinking for VSCode Claude Code'
          git push origin HEAD:main

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows x64 installers
        shell: pwsh
        run: |
          # This fork does not have upstream's private updater signing key.
          # Disable updater artifacts for this CI build; MSI/NSIS installers
          # themselves remain normal Tauri Windows packages.
          pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Prepare Windows release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release-assets | Out-Null

          $msi = Get-ChildItem src-tauri/target/release/bundle/msi -Filter '*.msi' -File | Select-Object -First 1
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.exe' -File | Select-Object -First 1
          if (-not $msi) { throw 'MSI installer was not generated.' }
          if (-not $exe) { throw 'NSIS EXE installer was not generated.' }

          $msiName = "CC-Switch-v$version-Windows-x64.msi"
          $exeName = "CC-Switch-v$version-Windows-x64.exe"
          Copy-Item $msi.FullName "release-assets/$msiName" -Force
          Copy-Item $exe.FullName "release-assets/$exeName" -Force

          $hashLines = Get-ChildItem release-assets -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $hashLines | Set-Content release-assets/SHA256SUMS.txt -Encoding ascii
          Get-Content release-assets/SHA256SUMS.txt

      - name: Upload Windows x64 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CC-Switch-Windows-x64-custom
          if-no-files-found: error
          retention-days: 14
          path: release-assets/*

      - name: Publish rolling GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = 'custom-latest'
          $sha = (git rev-parse HEAD).Trim()
          $title = "CC Switch Custom v$version"
          $notes = @"
          Custom Windows x64 build based on the latest fork main.

          Includes the Claude Code VS Code compatibility fix for `Unsupported content type: redacted_thinking` when routing OpenAI Responses/Codex reasoning through the Anthropic bridge.

          Files:
          - MSI installer
          - NSIS EXE installer
          - SHA256SUMS.txt

          Source commit: $sha
          "@

          # Keep one stable rolling tag/release so the download URL does not change.
          git tag -f $tag $sha
          git push origin "refs/tags/$tag" --force

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --prerelease
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --title $title --notes $notes --prerelease
          }

          gh release upload $tag release-assets/* --repo $env:GITHUB_REPOSITORY --clobber
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,tagName,name --jq '.url'
